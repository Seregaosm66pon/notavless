name: Auto Update Nota Vless Subscriptions (Every 2 Hours)

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:        # Allows manual trigger in GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: update-vless
  cancel-in-progress: false

jobs:
  update-vless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache and install sing-box & Xray cores for real HTTP 204 verification
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/proxy-cores
          key: proxy-cores-sb1.14.4-xr26.11.9

      - name: Download sing-box and Xray binaries if not cached
        if: steps.cache-cores.outputs.cache-hit != 'true'
        run: |
          mkdir -p /usr/local/bin/proxy-cores
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp
          cp /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/proxy-cores/sing-box
          chmod +x /usr/local/bin/proxy-cores/sing-box
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip" -o /tmp/xr.zip
          unzip -q -o /tmp/xr.zip xray -d /usr/local/bin/proxy-cores
          chmod +x /usr/local/bin/proxy-cores/xray

      - name: Expose proxy cores on PATH
        run: |
          echo "/usr/local/bin/proxy-cores" >> $GITHUB_PATH

      - name: Run unit test suite
        run: |
          python -m unittest -v test_suite.py

      - name: Fetch, validate and update subscriptions
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || '8740400260:AAGeOM6eO27VfziUjmYGYeXgCVmQAF6eN-Y' }}
          TG_NOTIFY_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN || '8740400260:AAGeOM6eO27VfziUjmYGYeXgCVmQAF6eN-Y' }}
          TG_NOTIFY_CHANNEL: ${{ secrets.TG_NOTIFY_CHANNEL || '@notavless' }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          VPN_SOURCE_CHANNELS: ${{ secrets.VPN_SOURCE_CHANNELS }}
        run: |
          python refresh_vless_repo.py
